<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Analyzer Agent</title>

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            max-width: 900px;
            margin: auto;
            padding: 30px;
        }

        textarea {
            width: 100%;
            height: 260px;
            padding: 15px;
            border-radius: 10px;
            border: none;
            margin-top: 10px;
            font-size: 16px;
            background: #1e293b;
            color: white;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .result {
            margin-top: 30px;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.7;
        }
    </style>
</head>
<body>

<h1>AI Chat Analyzer Agent</h1>

<p>
上传聊天记录后，AI 会自动分析聊天状态并生成下一句回复建议。
</p>

<form method="POST">
    <textarea name="chat" placeholder="粘贴聊天记录..."></textarea>

    <button type="submit">开始分析</button>
</form>

{% if result %}
<div class="result">
{{ result }}
</div>
{% endif %}

</body>
</html>
